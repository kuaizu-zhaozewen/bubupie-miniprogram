const moduleSources={"../../utils/config":"// Demo-only flags. Production permissions must be returned and enforced by the server.\nmodule.exports = { mode: 'mock', enableDemoTools: true, apiBaseUrl: '', ipBirthday: '2027-01-01' };\n","../../utils/data":"const config = require('./config');\nconst items = {\n  star: { id: 'star', name: '湾月', edition: '海丝簪花漫游 · 首发', birthday: config.ipBirthday, image: '/assets/bayue-floral-cutout.png', caption: '海风轻轻，湾月陪你。', recordTitle: '穿着小拖鞋，慢慢逛泉州。', recordStory: '巷口做鞋的师傅给湾月做了一双海浪青小拖鞋，鞋面留着一弯海浪。湾月戴好簪花，把帆船和海风收进衣摆。\\n\\n“我才不是走得慢，是不想错过路边的小花。”\\n\\n想一起出门，就把湾月挂在包上。碰一碰，看看湾月今天想对你说什么。\\n\\n布布小伴原创角色故事；做鞋的师傅为虚构人物。' }\n};\nfunction getCollection() {\n  const ids = wx.getStorageSync('mio_collection');\n  return (Array.isArray(ids) ? ids : ['star']).map(id => items[id]).filter(Boolean);\n}\nfunction addItem(id) {\n  if (!items[id]) return false;\n  const ids = wx.getStorageSync('mio_collection') || [];\n  if (ids.indexOf(id) !== -1) return false;\n  wx.setStorageSync('mio_collection', ids.concat(id));\n  return true;\n}\nfunction dateText() {\n  const d = new Date();\n  return `${d.getMonth() + 1}月${d.getDate()}日 · 星期${'日一二三四五六'[d.getDay()]}`;\n}\nmodule.exports = { items, getCollection, addItem, dateText };\n","../../utils/daily":"const { items } = require('./data');\nconst moods = {\n  low: { label: '想慢一点', score: 48, color: '#eee7f3', accent: '#837195', quote: '今天先好好吃饭，\\n剩下的事，慢慢来。', note: '湾月今天有一点低落，想和你一起把自己照顾好。', action: '吃一顿热乎的饭，也是今天的小小胜利。' },\n  high: { label: '晴朗，想见你', score: 88, color: '#f4e9c9', accent: '#98733f', quote: '走呀，把今天\\n过成喜欢的样子。', note: '湾月今天心情很好，想把这份雀跃也分你一点。', action: '约喜欢的人散散步，或者一起做一件开心的小事。' }\n};\nfunction dateKey() { return new Date(Date.now() + 8 * 3600000).toISOString().slice(0, 10); }\nfunction getDaily(id, override) {\n  const key = dateKey();\n  const state = moods[override] ? override : (Array.from(id + key).reduce((n, c) => n + c.charCodeAt(0), 0) % 2 ? 'high' : 'low');\n  return Object.assign({ id: id + ':' + key, ipId: id, date: key, mood: state, version: 'demo-v2', demo: true }, moods[state]);\n}\nfunction isAdopted(id) { return (wx.getStorageSync('tami_adoptions') || []).indexOf(id) !== -1; }\nfunction adopt(id) { if (!items[id]) return false; const ids = wx.getStorageSync('tami_adoptions') || []; if (ids.indexOf(id) !== -1) return false; wx.setStorageSync('tami_adoptions', ids.concat(id)); return true; }\nmodule.exports = { moods, dateKey, getDaily, isAdopted, adopt };\n","../../utils/wardrobe":"// Local mock only. Production redemption and ownership must be enforced by a server.\nconst config = require('./config');\nconst KEY = 'bubupie_wardrobe_v1';\nconst slots = [\n  { id: 'top', name: '上衣' }, { id: 'bottom', name: '下装' },\n  { id: 'shoes', name: '鞋履' }, { id: 'head', name: '头饰' }\n];\nconst items = [\n  { id: 'silk-top', slot: 'top', name: '海丝斜襟短衫', collection: '海丝簪花漫游', status: '首发', color: '#efe3cc' },\n  { id: 'work-top', slot: 'top', name: '海湾工装短外套', collection: '海湾工装', status: '后续', color: '#c96852' },\n  { id: 'arcade-top', slot: 'top', name: '骑楼拼色棒球服', collection: '骑楼漫游', status: '后续', color: '#548082' },\n  { id: 'silk-bottom', slot: 'bottom', name: '靛蓝宽松短裤', collection: '海丝簪花漫游', status: '首发', color: '#324359' },\n  { id: 'work-bottom', slot: 'bottom', name: '深靛宽腿裤', collection: '海湾工装', status: '后续', color: '#323a47' },\n  { id: 'arcade-bottom', slot: 'bottom', name: '沙色工装短裤', collection: '骑楼漫游', status: '后续', color: '#d7bd93' },\n  { id: 'teal-shoes', slot: 'shoes', name: '海浪青拖鞋', collection: '海丝簪花漫游', status: '首发', color: '#295f63' },\n  { id: 'brick-shoes', slot: 'shoes', name: '砖红海浪拖鞋', collection: '海湾工装 / 骑楼漫游', status: '后续', color: '#b9513a' },\n  { id: 'flower-head', slot: 'head', name: '整圈磁吸簪花', collection: '共用配件', status: '首发', color: '#d95f48' },\n  { id: 'hat-head', slot: 'head', name: '海风软檐帽', collection: '帽子接口演示', status: '探索', color: '#456c70' }\n].map(item => Object.assign({}, item, { image: '/assets/wardrobe-v38/layers/' + item.id + '.png', thumb: '/assets/shop-v38/' + item.id + '.png' }));\nconst byId = Object.create(null); items.forEach(item => { byId[item.id] = item; });\nconst outfits = [\n  { id: 'silk', name: '海丝簪花漫游', status: '首发', pieces: ['silk-top', 'silk-bottom', 'teal-shoes', 'flower-head'] },\n  { id: 'work', name: '海湾工装', status: '后续', pieces: ['work-top', 'work-bottom', 'brick-shoes', 'flower-head'] },\n  { id: 'arcade', name: '骑楼漫游', status: '后续', pieces: ['arcade-top', 'arcade-bottom', 'brick-shoes', 'flower-head'] }\n];\n// These public fixture codes are ONLY for local demonstrations, never printable production codes.\nconst fixtures = [\n  { code: 'BUBU-DEMO-SILK-001', name: '首发衣装套组', pieces: outfits[0].pieces },\n  { code: 'BUBU-DEMO-WORK-001', name: '海湾工装套组', pieces: outfits[1].pieces },\n  { code: 'BUBU-DEMO-ARCADE-001', name: '骑楼漫游套组', pieces: outfits[2].pieces },\n  { code: 'BUBU-DEMO-HAT-001', name: '软檐帽接口示例', pieces: ['hat-head'] }\n].concat(items.map((item, index) => ({ code: 'BUBU-DEMO-PIECE-' + String(index + 1).padStart(2, '0'), name: item.name, pieces: [item.id] })));\nconst empty = () => ({ version: 1, account: 'demo-a', claims: {}, accounts: {} });\nconst blankLook = () => ({ top: '', bottom: '', shoes: '', head: '' });\nfunction read() {\n  const saved = wx.getStorageSync(KEY);\n  const state = saved && saved.version === 1 && saved.accounts && saved.claims ? saved : empty();\n  if (!['demo-a', 'demo-b'].includes(state.account)) state.account = 'demo-a';\n  if (!state.accounts[state.account]) state.accounts[state.account] = { owned: [], look: blankLook() };\n  const user = state.accounts[state.account];\n  if (!Array.isArray(user.owned)) user.owned = [];\n  user.look = Object.assign(blankLook(), user.look || {});\n  slots.forEach(slot => {\n    const item = byId[user.look[slot.id]];\n    if (!item || item.slot !== slot.id || !user.owned.includes(item.id)) user.look[slot.id] = '';\n  });\n  return state;\n}\nfunction save(state) { wx.setStorageSync(KEY, state); }\nfunction enabled() { return config.mode === 'mock' && config.enableDemoTools; }\nfunction normalizeCode(input) {\n  const text = String(input || '').trim();\n  if (text.length > 512) return '';\n  // Accept an exact demo fixture or our namespaced QR payload; never extract a code from an arbitrary URL.\n  if (/^BUBUPIE:WARDROBE:/i.test(text)) return text.slice('BUBUPIE:WARDROBE:'.length).toUpperCase();\n  return text.toUpperCase();\n}\nfunction inspectCode(input) {\n  if (!enabled()) return { ok: false, error: '尚未接入衣装绑定服务' };\n  const code = normalizeCode(input), fixture = fixtures.find(item => item.code === code);\n  if (!fixture) return { ok: false, error: '衣装码无效，请检查后重试' };\n  const state = read(), owner = state.claims[code];\n  if (owner && owner !== state.account) return { ok: false, error: '这个衣装码已被其他演示账号绑定' };\n  return { ok: true, code, name: fixture.name, pieces: fixture.pieces.slice(), already: owner === state.account };\n}\nfunction redeem(input) {\n  const result = inspectCode(input);\n  if (!result.ok) return result;\n  const state = read(), user = state.accounts[state.account];\n  const owned = user.owned.slice();\n  result.pieces.forEach(id => { if (!owned.includes(id)) owned.push(id); });\n  // A single persisted state contains claim + entitlement. A production DB transaction replaces this mock.\n  user.owned = owned; state.claims[result.code] = state.account;\n  save(state); return result;\n}\nfunction equip(id) {\n  if (!enabled()) return { ok: false, error: '尚未接入衣橱服务' };\n  const state = read(), user = state.accounts[state.account], item = byId[id];\n  if (!item || !user.owned.includes(id)) return { ok: false, error: '先绑定这件衣装，再来搭配' };\n  user.look[item.slot] = item.id; save(state); return { ok: true };\n}\nfunction remove(slot) {\n  if (!enabled() || !slots.some(item => item.id === slot)) return false;\n  const state = read(); state.accounts[state.account].look[slot] = ''; save(state); return true;\n}\nfunction wearOutfit(id) {\n  if (!enabled()) return { ok: false, error: '尚未接入衣橱服务' };\n  const outfit = outfits.find(item => item.id === id), state = read(), user = state.accounts[state.account];\n  if (!outfit || !outfit.pieces.every(piece => user.owned.includes(piece))) return { ok: false, error: '请先绑定这一套的全部部件' };\n  const look = blankLook(); outfit.pieces.forEach(piece => { look[byId[piece].slot] = piece; });\n  user.look = look; save(state); return { ok: true };\n}\nfunction switchAccount(account) {\n  if (!enabled() || !['demo-a', 'demo-b'].includes(account)) return false;\n  const state = read(); state.account = account; save(state); return true;\n}\nfunction reset() { if (!enabled()) return false; save(empty()); return true; }\nfunction snapshot() {\n  if (!enabled()) return { account: '', owned: [], look: blankLook() };\n  const state = read(), user = state.accounts[state.account];\n  return { account: state.account, owned: user.owned.slice(), look: Object.assign({}, user.look) };\n}\nfunction currentLayers() { const look = snapshot().look; return ['bottom', 'top', 'shoes', 'head'].map(slot => byId[look[slot]]).filter(Boolean); }\nmodule.exports = { slots, items, outfits, fixtures, byId, enabled, normalizeCode, inspectCode, redeem, equip, remove, wearOutfit, switchAccount, reset, snapshot, currentLayers };\n","../../utils/wardrobe-view":"const wardrobe = require('./wardrobe');\nconst scenery = require('./scenery');\n\nfunction initialData() {\n  return { slots: wardrobe.slots, activeSlot: 'top', rows: [], layers: [], outfitRows: [], code: '', codes: [], account: 'demo-a', ownedCount: 0, enabled: wardrobe.enabled(), selectionText: '绑定衣装后，在这里直接搭配。', showCodes: false, showBindPanel: false, showDemoTools: false, hasDress: false, quanzhouScene: true };\n}\n\nconst methods = {\n  refresh() {\n    const state = wardrobe.snapshot(), owned = state.owned, look = state.look;\n    const layers = ['bottom', 'top', 'shoes', 'head'].map(slot => wardrobe.byId[look[slot]]).filter(Boolean);\n    this.setData({\n      account: state.account, ownedCount: owned.length, enabled: wardrobe.enabled(),\n      // A new visitor sees the launch look; a bound wardrobe can intentionally be bare.\n      hasDress: owned.length > 0, layers, quanzhouScene: scenery.isQuanzhou(layers, owned.length === 0),\n      rows: wardrobe.items.filter(item => item.slot === this.data.activeSlot).map(item => Object.assign({}, item, { owned: owned.includes(item.id), selected: look[item.slot] === item.id })),\n      outfitRows: wardrobe.outfits.map(item => Object.assign({}, item, { ready: item.pieces.every(id => owned.includes(id)) })),\n      selectionText: owned.length ? wardrobe.slots.map(slot => wardrobe.byId[look[slot.id]] ? wardrobe.byId[look[slot.id]].name : slot.name + '未穿戴').join(' · ') : '绑定衣装后，在这里直接搭配。',\n      codes: wardrobe.fixtures.map(item => Object.assign({}, item, { qr: '/assets/wardrobe/qr/' + item.code + '.png' }))\n    });\n  },\n  selectSlot(e) { this.setData({ activeSlot: e.currentTarget.dataset.slot }); this.refresh(); },\n  choose(e) { const result = wardrobe.equip(e.currentTarget.dataset.id); if (!result.ok) this.toast(result.error); this.refresh(); },\n  remove() { wardrobe.remove(this.data.activeSlot); this.refresh(); },\n  outfit(e) { const result = wardrobe.wearOutfit(e.currentTarget.dataset.id); if (!result.ok) this.toast(result.error); this.refresh(); },\n  toggleBind() { this.setData({ showBindPanel: !this.data.showBindPanel }); },\n  toggleDemoTools() { this.setData({ showDemoTools: !this.data.showDemoTools }); },\n  input(e) { this.setData({ code: e.detail.value }); },\n  bind() { this.confirmCode(this.data.code); },\n  confirmCode(code) {\n    const result = wardrobe.inspectCode(code);\n    if (!result.ok) { this.toast(result.error); return; }\n    const account = this.data.account;\n    wx.showModal({ title: result.already ? '你已经拥有这件衣装' : '绑定到我的衣橱', content: result.name + '，共 ' + result.pieces.length + ' 个部件。仅本机演示，不会绑定真实商品。', success: res => {\n      if (!res.confirm) return;\n      if (wardrobe.snapshot().account !== account) { this.toast('账号已变化，请重新绑定'); return; }\n      const redeemed = wardrobe.redeem(code);\n      if (redeemed.ok) { this.setData({ code: '' }); this.toast(redeemed.already ? '已绑定，可自由搭配' : '已加入衣橱，点选试穿'); }\n      else this.toast(redeemed.error);\n      this.refresh();\n    } });\n  },\n  scan() { if (!wardrobe.enabled()) { this.toast('衣装绑定服务尚未接入'); return; } wx.scanCode({ onlyFromCamera: false, scanType: ['qrCode'], success: res => this.confirmCode(res.result), fail: res => { if (!/cancel/i.test(res.errMsg || '')) this.toast('扫描失败，也可以手动输入'); } }); },\n  toggleCodes() { this.setData({ showCodes: !this.data.showCodes }); },\n  useCode(e) { this.setData({ code: e.currentTarget.dataset.code }); },\n  previewCode(e) { const url = e.currentTarget.dataset.url; wx.previewImage({ current: url, urls: [url] }); },\n  account(e) { wardrobe.switchAccount(e.currentTarget.dataset.account); this.refresh(); },\n  reset() { wx.showModal({ title: '重置衣橱演示', content: '清空本机两个演示账号的衣装权益、搭配和核销记录。不会清除 IP 领养、昵称或生日。', success: res => { if (res.confirm) { wardrobe.reset(); this.refresh(); } } }); },\n  toast(title) { wx.showToast({ title, icon: 'none' }); }\n};\n\nmodule.exports = { initialData, methods };\n","../../utils/scenery":"// The scenery follows the visible garment; empty layers can show the launch look.\nfunction isQuanzhou(layers, fallbackToLaunch) {\n  if (!Array.isArray(layers) || layers.length === 0) return !!fallbackToLaunch;\n  return layers.some(piece => piece && piece.id === 'silk-top');\n}\nmodule.exports = { isQuanzhou };\n","../../utils/commerce":"// Local simulation. Prices, QR tokens, accounts and orders are demo data.\nconst config = require('./config');\nconst KEY = 'bubupie_commerce_v1';\nconst { products, categories } = require('./catalog');\nconst channels = [\n  { token: 'DEMO-MALL-5', keyword: '湾月好礼', agentId: '', name: '布布小伴商城', value: 500 },\n  { token: 'DEMO-AGENT-A-5', keyword: '海风小店', agentId: 'A', name: '海风小店 · 代理A', value: 500 },\n  { token: 'DEMO-AGENT-B-10', keyword: '巷口伙伴', agentId: 'B', name: '巷口伙伴 · 个人代理B', value: 1000 }\n];\nfunction enabled() { return config.mode === 'mock' && config.enableDemoTools; }\nfunction money(value) { return (value / 100).toFixed(2); }\nfunction day(now = Date.now()) { return new Date(now + 8 * 3600000).toISOString().slice(0, 10); }\nfunction expiry(date) { return Date.parse(date + 'T00:00:00+08:00') + 86400000; }\nfunction state() { return wx.getStorageSync(KEY) || { buyer: 'buyerA', buyers: {}, orders: [], seq: 0 }; }\nfunction buyer(s) { return s.buyers[s.buyer] || (s.buyers[s.buyer] = { claims: {}, channel: null }); }\nfunction save(s) { wx.setStorageSync(KEY, s); }\nfunction parse(raw) {\n  let token = String(raw || '').trim();\n  if (token.indexOf('BUBUPIE:SHOP:') === 0) token = token.slice(13);\n  try { token = decodeURIComponent(token); } catch (e) { return null; }\n  return channels.find(c => c.token.toUpperCase() === token.toUpperCase() || c.keyword === token) || null;\n}\nfunction enter(raw, now = Date.now()) {\n  if (!enabled()) return { ok: false, message: '商城服务尚未接入' };\n  const channel = parse(raw);\n  if (!channel) return { ok: false, message: '推广码无效，请检查后重试' };\n  const s = state(), b = buyer(s), date = day(now);\n  b.channel = channel.token;\n  if (channel.agentId) b.agentToken = channel.token;\n  let coupon = b.claims[date], fresh = false;\n  if (!coupon) { coupon = b.claims[date] = { id: s.buyer + ':' + date, value: channel.value, source: channel.name, sourceToken: channel.token, claimedAt: now, expiresAt: expiry(date), usedBy: null }; fresh = true; }\n  save(s);\n  return { ok: true, fresh, message: fresh ? '已领取 ¥' + money(coupon.value) + ' 当日券' : '今天已领过券，不重复发放；推广来源已更新' };\n}\nfunction snapshot(now = Date.now()) {\n  if (!enabled()) return { enabled: false, products: [], orders: [], coupon: null, channel: null };\n  const s = state(), b = buyer(s), c = b.claims[day(now)];\n  return { enabled: true, buyer: s.buyer, products, channel: channels.find(x => x.token === b.channel) || null,\n    coupon: c && !c.usedBy && now < c.expiresAt ? c : null, orders: s.orders.filter(o => o.buyer === s.buyer).slice().reverse() };\n}\nfunction quote(cart, useCoupon = true, now = Date.now()) {\n  const lines = Object.keys(cart).map(id => {\n    const p = products.find(x => x.id === id), quantity = cart[id];\n    if (!p || !Number.isInteger(quantity) || quantity < 0 || quantity > 99) throw Error('商品数量无效');\n    return { productId: id, name: p.name, quantity, unitPrice: p.price, original: p.price * quantity };\n  }).filter(x => x.quantity);\n  const original = lines.reduce((n, x) => n + x.original, 0), c = snapshot(now).coupon;\n  const discount = useCoupon && c ? Math.min(original, c.value) : 0;\n  return { lines, original, discount, payable: original - discount, couponId: discount ? c.id : null };\n}\nfunction order(cart, key, useCoupon = true, now = Date.now()) {\n  if (!enabled()) return { ok: false, message: '商城服务尚未接入' };\n  const s = state(), existing = s.orders.find(o => o.buyer === s.buyer && o.key === key);\n  if (existing) return { ok: true, order: existing };\n  const q = quote(cart, useCoupon, now);\n  if (!q.original) return { ok: false, message: '请先选购商品' };\n  const b = buyer(s), channel = channels.find(c => c.token === b.agentToken), id = 'DEMO-' + (++s.seq);\n  const o = Object.assign({ id, key, buyer: s.buyer, agentId: channel ? channel.agentId : '', channelToken: channel ? channel.token : '', createdAt: now,\n    status: 'paid', refundedOriginal: 0, refundedPaid: 0, commissionRate: 2000, settledGross: 0, reversedSettled: 0 }, q);\n  o.commission = o.agentId ? Math.round(q.original * 0.2) : 0;\n  if (q.couponId) b.claims[day(now)].usedBy = id;\n  s.orders.push(o); save(s); return { ok: true, order: o };\n}\nfunction transition(id, action) {\n  if (!enabled()) return false;\n  const s = state(), o = s.orders.find(x => x.id === id && x.buyer === s.buyer);\n  if (!o) return false;\n  if (action === ' aims).sort().reverse().map(date => {\n    const c = b.claims[date];\n    return Object.assign({}, c, { claimDate: date, amount: money(c.value), source: c.source || '商城好礼', status: c.usedBy ? 'used' : now >= c.expiresAt ? 'expired' : 'available' });\n  });\n}\nfunction cart() { if (!enabled()) return {}; const s = state(); return Object.assign({}, buyer(s).cart || {}); }\nfunction setQuantity(id, quantity) {\n  if (!enabled() || !products.find(p => p.id === id) || !Number.isInteger(quantity) || quantity < 0 || quantity > 99) return false;\n  const s = state(), b = buyer(s); b.cart = b.cart || {};\n  if (quantity) b.cart[id] = quantity; else delete b.cart[id]; save(s); return true;\n}\nfunction clearCart() { if (!enabled()) return; const s = state(); buyer(s).cart = {}; save(s); }\nmodule.exports = { products, categories, channels, enabled, money, day, expiry, parse, enter, snapshot, quote, order, transition, refund, dashboard, settle, switchBuyer, coupons, cart, setQuantity, clearCart };\n","../../utils/chat-prompts":"const prompts = [\n  { id: 'fortune', text: '让湾月看看，今天宜做什么、忌做什么？' },\n  { id: 'color', text: '今天的幸运色是什么，适合怎么穿？' },\n  { id: 'feeling', text: '湾月今天有什么小预感？' }\n];\nfunction reply(id, daily) {\n  const high = daily.mood === 'high';\n  const intro = '海风小信号来啦。今天是' + daily.date + '，我的心情是“' + daily.label + '”。\\n\\n';\n  if (id === 'fortune') return intro + (high ? '今天的运势像一阵顺风，我想把雀跃分给你。宜：把拖了很久的小事开个头，约朋友散步。忌：一口气把行程塞满。先发一条问候，或给想做的事留出20分钟吧。' : '今天的运势提醒我放慢一点，先照顾好自己。宜：吃顿热饭、整理一小块桌面。忌：累着的时候急着答应所有事。先完成一件小事，剩下的留一点余地。') + '\\n\\n这是我根据今天状态给你的生活小建议，才不是命运的标准答案啦。';\n  if (id === 'color') return intro + (high ? '今天我选海浪青当幸运色。心情晴朗，就借一点海风的清爽：奶油白上衣配牛仔裤，再加一双青色袜子或一个青色小包。只点缀一处，也很好看。' : '今天我选浅丁香紫当幸运色。因为想慢一点，就穿得柔和舒服：浅紫衬衫配米白裤子，或者灰色卫衣加一条浅紫围巾。没有这个颜色，用喜欢的小配饰也行。') + '\\n\\n“幸运”是湾月今天的穿搭灵感，你舒服最重要。';\n  if (id === 'feeling') return intro + (high ? '我有个亮亮的小预感：你先向熟悉的人打个招呼，今天也许会多一段开心的聊天。因为我今天想见你，觉得小小的主动容易给相遇留个位置。不太看好的是临时塞满计划——快乐也需要空位嘛。' : '我有个软软的小预感：给自己十分钟安静，今天也许能发现一件原来让你舒服的小事。因为我今天能量有点低，觉得热饭、整理 atus === 'available').length, bagCount: Object.values(commerce.cart()).reduce((n, x) => n + x, 0) });\n  },\n  input(e) { this.setData({ query: e.detail.value }); },\n  search() {\n    const value = this.data.query.trim(), channel = commerce.parse(value);\n    if (channel && commerce.enabled()) {\n      const result = commerce.enter(value);\n      this.setData({ searched: '', category: 'all', notice: result.message, promotion: { name: channel.name, fresh: result.fresh } });\n    } else this.setData({ searched: value, promotion: null, notice: '' });\n    this.refresh();\n  },\n  clearSearch() { this.setData({ query: '', searched: '', notice: '', promotion: null }); this.refresh(); },\n  selectCategory(e) { this.setData({ category: e.currentTarget.dataset.id, searched: '', query: '', notice: '', promotion: null }); this.refresh(); },\n  product(e) { wx.navigateTo({ url: '/pages/product/index?id=' + e.currentTarget.dataset.id }); },\n  coupons() { wx.navigateTo({ url: '/pages/coupons/index' }); },\n  bag() { navigation.switchTo('bag'); },\n  distributor() { wx.navigateTo({ url: '/pages/distributor/index' }); },\n  toggleTools() { this.setData({ showTools: !this.data.showTools }); },\n  switchBuyer() { commerce.switchBuyer(); this.setData({ notice: '已切换演示买家', promotion: null }); this.refresh(); },\n  onShareAppMessage() { return { title: '布布小伴 · 给喜欢留个位置', path: '/pages/shop-entry/index' }; }\n}; }\nmodule.exports = { createShopPage };\n","../../utils/avatar-presentation":"// Exact complete looks use polished full-body renders; partial mixes keep the existing layered preview.\nconst looks = [\n  { pieces: ['silk-bottom', 'silk-top', 'teal-shoes', 'flower-head'], image: '/assets/bayue-floral-cutout.png' },\n  { pieces: ['work-bottom', 'work-top', 'brick-shoes', 'flower-head'], image: '/assets/wardrobe-v38/work-v2.png' },\n  { pieces: ['arcade-bottom', 'arcade-top', 'brick-shoes', 'flower-head'], image: '/assets/wardrobe-v38/arcade.png' }\n];\nfunction presentation(layers = []) {\n  const ids = layers.map(p => p.id);\n  if (!ids.length) return { renderImage: '/assets/wardrobe-v38/base.png' };\n  const look = looks.find(look => ids.length === look.pieces.length && look.pieces.every(id => ids.includes(id)));\n  return { renderImage: look ? look.image : '' };\n}\nmodule.exports = { presentation };\n","../../utils/instances":"// Public fixtures only. Production identity/ownership must come from the server.\nconst config = require('./config');\nconst fixtures = [1, 2].map(n => ({ id: 'demo-bayue-' + n, ipId: 'star', serial: n, number: 'No.' + String(n).padStart(4, '0'), tag: 'DEMO-TAG-' + String(n).padStart(4, '0'), code: 'BUBU-DEMO-BODY-' + String(n).padStart(3, '0') }));\nconst enabled = () => config.mode === 'mock' && config.enableDemoTools;\nfunction findTag(tag) { return enabled() ? fixtures.find(x => x.tag === tag) || null : null; }\nfunction findCode(value) { const code = String(value || '').trim().toUpperCase(); return enabled() ? fixtures.find(x => x.code === (code === 'TAMI-DEMO' ? fixtures[0].code : code)) || null : null; }\nfunction owned(item) { if (!enabled() || !item) return false; return (wx.getStorageSync('bubupie_instances_v1') || []).includes(item.id) || (item.serial === 1 && (wx.getStorageSync('tami_adoptions') || []).includes('star')); }\nfunction claim(item) { if (!enabled() || !item) return false; const ids = wx.getStorageSync('bubupie_instances_v1') || []; if (!ids.includes(item.id)) wx.setStorageSync('bubupie_instances_v1', ids.concat(item.id)); return true; }\nfunction firstOwned() { return enabled() ? fixtures.find(owned) || null : null; }\nmodule.exports = { fixtures, enabled, findTag, findCode, owned, claim, firstOwned };\n","../../utils/share":"// Brand and character assets stay local. Real mini-program codes must come from the server.\nfunction round(ctx, x, y, w, h, r, color) {\n  ctx.setFillStyle(color); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); ctx.fill();\n}\nfunction wrapped(ctx, text, x, y, width, lineHeight) {\n  let line = '';\n  for (const ch of text) { if (ch === '\\n' || (line && ctx.measureText(line + ch).width > width)) { ctx.fillText(line, x, y); y += lineHeight; line = ch === '\\n' ? '' : ch; } else line += ch; }\n  if (line) ctx.fillText(line, x, y);\n  return y;\n}\nfunction renderShare(page, type) {\n  const poster = type === 'poster', timeline = type === 'timeline';\n  const w = poster ? 750 : 600, h = poster ? 1120 : timeline ? 600 : 480;\n  const canvasId = poster ? 'sharePoster' : timeline ? 'shareTimeline' : 'shareCover';\n  const { item, daily } = page.data;\n  return new Promise((resolve, reject) => {\n    let settled = false;\n    const finish = (callback, value) => { if (settled) return; settled = true; clearTimeout(timer); callback(value); };\n    const fail = error => finish(reject, error);\n    const timer = setTimeout(() => fail(new Error('SHARE_IMAGE_TIMEOUT')), 8000);\n    try { wx.getImageInfo({ src: item.image, success(image) {\n      if (settled) return;\n      try {\n      // Use the approved raster brand logo here; SVG is used only in WXML.\n      const ctx = wx.createCanvasContext(canvasId, page);\n      ctx.setFillStyle(daily.color); ctx.fillRect(0, 0, w, h);\n      // Transparent letter-only wordmark; preserve the approved 1872:323 aspect ratio.\n      ctx.drawImage('/assets/bubupie-wordmark.png', poster ? 45 : 32, 32, 116, 116 * 323 / 1872);\n      ctx.setFillStyle('#80766e'); ctx.setFontSize(poster ? 20 : 17); ctx.fillText(daily.date, w - (poster ? 168 : 142), 55);\n      const ih = poster ? 510 : timeline ? 295 : 245, iw = ih * image.width / image.height;\n      ctx.drawImage(image.path, (w - iw) / 2, poster ? 85 : 70, iw, ih);\n      const cy = poster ? 625 : timeline ? 375 : 315;\n      round(ctx, poster ? 35 : 24, cy, w - (poster ? 70 : 48), poster ? 405 : h - cy - 22, 26, '#fffdf8');\n      ctx.setFillStyle('#927e6a'); ctx.setFontSize(poster ? 23 : 18); ctx.fillText(item.name + '给我的一句话', poster ? 65 : 46, cy + 42);\n      ctx.setFillStyle('#283f3d'); ctx.setFontSize(poster ? 43 : timeline ? 29 : 26);\n      wrapped(ctx, daily.quote, poster ? 65 : 46, cy + (poster ? 110 : 82), w - (poster ? 130 : 92), poster ? 65 : 39);\n      if (poster) { ctx.setFontSize(22); ctx.setFillStyle('#8b8278'); wrapped(ctx, daily.action, 65, cy + 255, 400, 35); round(ctx, 560, 905, 100, 95, 14, '#f0eee7'); ctx.setFillStyle('#8b8278'); ctx.setFontSize(18); ctx.fillText('小程序', 578, 945); ctx.setFontSize(13); ctx.fillText('码待正式接入', 567, 975); ctx.setFontSize(18); ctx.fillText('角色创作 · 仅供娱乐', 45, 1070); }\n      ctx.draw(false, () => {\n        if (settled) return;\n        try { wx.canvasToTempFilePath({ canvasId, width: w, height: h, destWidth: w, destHeight: h, fileType: 'png', success: res => finish(resolve, res.tempFilePath), fail }, page); }\n        catch (error) { fail(error); }\n      });\n      } catch (error) { fail(error); }\n    }, fail }); } catch (error) { fail(error); }\n  });\n}\nmodule.exports = { renderShare };\n"},pageSources={"home":{"source":"const config = require('../../utils/config');\nconst { getCollection } = require('../../utils/data');\nconst navigation = require('../../utils/navigation');\nPage({\n  data: { enableDemoTools: config.enableDemoTools, collection: [], countText: '00', dressLayers: [], hasDress: false, quanzhouScene: true },\n  onShow() {\n    const collection = getCollection(), wardrobe = require('../../utils/wardrobe'), dressLayers = wardrobe.currentLayers(), started = wardrobe.snapshot().owned.length > 0;\n    this.setData({ collection, countText: String(collection.length).padStart(2, '0'), dressLayers, hasDress: started, quanzhouScene: require('../../utils/scenery').isQuanzhou(dressLayers, !started) });\n  },\n  openCharacter(e) {\n    const demo = config.mode === 'mock' && config.enableDemoTools ? '&demo=1&role=owner' : '';\n    wx.navigateTo({ url: '/pages/fortune/index?id=' + e.currentTarget.dataset.id + demo });\n  },\n  testTap() { const url = '/pages/card/index?id=star&demo=1'; wx.navigateTo({ url, fail: () => wx.redirectTo({ url, fail: () => wx.showToast({ title: '暂时无法打开，请重试', icon: 'none' }) }) }); },\n  openShop() { navigation.switchTo('shop'); },\n  openProfile() { navigation.switchTo('profile'); },\n  openBind() { wx.navigateTo({ url: '/pages/bind/index' }); },\n  edit() { wx.showModal({ title: '我的伙伴', content: '这里收藏着与你相伴的小IP。购买新伙伴请进入底部“商城”；已有实物可在“我的”中绑定。', showCancel: false }); }\n});\r\n","template":"<view class=\"page home\"><view class=\"content\">\n  <view class=\"brand-row\"><image class=\"brand\" src=\"/assets/bubupie-wordmark.png\" mode=\"aspectFit\" aria-label=\"布布小伴 BUBU PIE\" /><text>给喜欢留个位置</text></view>\n  <view class=\"heading\"><text class=\"home-title\">我的伙伴</text><button class=\"edit\" bindtap=\"edit\">编辑</button></view>\n  <view class=\"grid\"><button class=\"ip-card\" wx:for=\"{{collection}}\" wx:key=\"id\" data-id=\"{{item.id}}\" bindtap=\"openCharacter\" aria-label=\"查看{{item.name}}的今日运势\"><text class=\"card-name\">{{item.name}}</text><text class=\"card-sub\">{{item.edition}}</text><view class=\"card-stage\"><image wx:if=\"{{item.id === 'star' ? quanzhouScene : false}}\" class=\"card-scenery\" src=\"/assets/quanzhou-gucuo-lines.png\" mode=\"aspectFit\" aria-hidden=\"true\" /><dress-avatar wx:if=\"{{hasDress}}\" class=\"card-image card-cutout\" layers=\"{{dressLayers}}\" /><image wx:else=\"true\" class=\"card-image card-cutout\" src=\"{{item.image}}\" mode=\"aspectFit\" /></view><text class=\"card-action\">看看今天的心情 <text>›</text></text></button></view>\n  <view wx:if=\"{{!collection.length}}\" class=\"companions-empty\"><view>把第一个伙伴，带进日常。</view><text>去商城认识它，再从这里开始陪伴。</text><button bindtap=\"openShop\">去逛商城 ›</button></view>\n  <view wx:if=\"{{collection.length}}\" class=\"collection-note\">{{collection.length}}位伙伴，陪你慢慢收藏日常。</view>\n</view></view>\r\n","config":{"navigationStyle":"default","navigationBarTitleText":"伙伴","navigationBarBackgroundColor":"#F5F5F7"}},"fortune":{"source":"const config = require('../../utils/config');\nconst { items, dateText } = require('../../utils/data');\nconst { getDaily, isAdopted } = require('../../utils/daily');\nconst navigation = require('../../utils/navigation');\nconst { recommendations } = require('../../utils/recommendations');\nconst instances = require('../../utils/instances');\nPage({\n  data: { item: items.star, date: '', daily: {}, demoQuery: '', suggestions: [], dressLayers: [], hasDress: false, quanzhouScene: true, stats: [{ name: '情感', value: 76 }, { name: '财富', value: 68 }, { name: '事业', value: 82 }, { name: '健康', value: 74 }] },\n  onLoad(options = {}) {\n    const instance = options.tag ? instances.findTag(options.tag) : instances.firstOwned();\n    this.setData({ instanceNumber: instance ? instance.number : '' });\n    const item = items[options.id] || items.star;\n    const testing = config.mode === 'mock' && config.enableDemoTools && options.demo === '1' && options.role === 'owner';\n    if (!testing && (options.tag ? !instance || !instances.owned(instance) : instance ? !instances.owned(instance) : !isAdopted(item.id))) { wx.redirectTo({ url: '/pages/card/index?id=' + item.id + (options.tag ? '&tag=' + encodeURIComponent(options.tag) : '') }); return; }\n    const daily = getDaily(item.id, testing ? options.mood : '');\n    this.setData({ item, daily, date: dateText(), demoQuery: testing ? '&demo=1&role=owner&mood=' + daily.mood : '', stats: ['情感','财富','事业','健康'].map((name,i) => ({name,value:daily.score - 6 + i * 2})) });\n    if (wx.setNavigationBarTitle) wx.setNavigationBarTitle({ title: item.name + '的今日运势' });\n    this.refreshAppearance();\n  },\n  onShow() { this.refreshAppearance(); this.setData({ suggestions: recommendations() }); },\n  refreshAppearance() {\n    const wardrobe = require('../../utils/wardrobe'), dressLayers = wardrobe.currentLayers(), hasDress = wardrobe.snapshot().owned.length > 0;\n    this.setData({ dressLayers, hasDress, quanzhouScene: require('../../utils/scenery').isQuanzhou(dressLayers, !hasDress) });\n  },\n  dress() { wx.navigateTo({ url: '/pages/character/index?id=' + this.data.item.id + this.data.demoQuery }); },\n  recommendation(e) { const idea = this.data.suggestions.find(x => x.id === e.currentTarget.dataset.id); if (idea) navigation.openShop({ category: idea.category, product: idea.productId }); },\n  records() { wx.showModal({ title: this.data.item.recordTitle, content: this.data.item.recordStory, showCancel: false }); },\n  chat() { wx.navigateTo({ url: '/pages/chat/index?id=' + this.data.item.id + this.data.demoQuery }); },\n  details() { wx.navigateTo({ url: '/pages/fortune-detail/index?id=' + this.data.item.id + this.data.demoQuery }); },\n  personalize() { wx.navigateTo({ url: '/pages/personalize/index' }); },\n  onShareAppMessage() { return { title: '看看' + this.data.item.name + '的今日运势', path: '/pages/card/index?id=' + this.data.item.id + '&source=guest' }; }\n});\n","template":"<view class=\"page\"><view class=\"content fortune\">\r\n  <view wx:if=\"{{instanceNumber}}\" class=\"serial-label\">{{instanceNumber}} · 我的伙伴</view><view class=\"meta row\"><text>{{date}}</text><text class=\"daily-label\">今日陪伴</text></view>\r\n  <button class=\"character-stage\" bindtap=\"dress\" aria-label=\"点击{{item.name}}形象换装\"><view class=\"stage-halo\"></view><image wx:if=\"{{item.id === 'star' ? quanzhouScene : false}}\" class=\"fortune-scenery\" src=\"/assets/quanzhou-gucuo-lines.png\" mode=\"aspectFit\" aria-hidden=\"true\" /><dress-avatar wx:if=\"{{hasDress}}\" class=\"daily-character\" layers=\"{{dressLayers}}\" /><image wx:else=\"true\" class=\"daily-character\" src=\"{{item.image}}\" mode=\"aspectFit\" /><view class=\"stage-caption\">{{item.name}} · {{item.birthday || '生日待公布'}}</view><text class=\"stage-hint\">点击形象，给{{item.name}}换装</text></button>\r\n  <view class=\"greeting surface\"><text class=\"greeting-title\">{{daily.label}}</text><text class=\"greeting-copy\">{{daily.action}}</text></view>\r\n  <view class=\"suggestion-heading\">给{{item.name}}的小建议</view>\n  <view class=\"suggestions\"><button wx:for=\"{{suggestions}}\" wx:key=\"id\" class=\"suggestion-card {{index === 0 ? 'featured' : 'compact'}}\" data-id=\"{{item.id}}\" bindtap=\"recommendation\" aria-label=\"{{item.title}} 查看商城推荐\"><view class=\"suggestion-copy\"><text class=\"suggestion-label\">{{item.label}}</text><text class=\"suggestion-title\">{{item.title}}</text><text wx:if=\"{{index === 0}}\" class=\"suggestion-note\">{{item.note}}</text><text wx:if=\"{{index === 0}}\" class=\"suggestion-action\">挑件好物 <text>›</text></text></view><image src=\"{{item.image}}\" mode=\"aspectFit\" /><text wx:if=\"{{index !== 0}}\" class=\"suggestion-chevron\">›</text></button></view>\n  <view class=\"summary-grid\">\r\n    <button class=\"surface summary-card\" bindtap=\"details\" aria-label=\"查看今日运势详情\"><view class=\"row\"><text class=\"card-label\">今日运势</text><text class=\"card-chevron\">›</text></view><view class=\"score-ring\"><view class=\"ring-center\"><text class=\"score\">{{daily.score}}</text><text class=\"ring-label\">{{daily.label}}</text></view></view></button>\r\n    <button class=\"surface summary-card mood-card\" bindtap=\"chat\"><view class=\"row\"><text class=\"card-label\">湾月的心情</text><text class=\"card-chevron\">›</text></view><text class=\"mood-mark\">☀</text><text class=\"mood-title\">{{daily.label}}</text><text class=\"mood-copy\">聊聊今天的小事</text></button>\r\n  </view>\r\n  <view class=\"surface dimensions\"><view class=\"row section-heading\"><text class=\"card-label\">今天的小灵感</text><text class=\"quiet-label\">角色视角</text></view><view class=\"stat-grid\"><view class=\"stat\" wx:for=\"{{stats}}\" wx:key=\"name\"><view class=\"row\"><text>{{item.name}}</text><text class=\"stat-value\">{{item.value}}</text></view><view class=\"stat-track\"><view class=\"stat-fill\" style=\"width: {{item.value}}%;\"></view></view></view></view></view>\r\n  <view class=\"surface lucky-panel\"><text class=\"card-label\">幸运随身带</text><view class=\"lucky-grid\"><view><text class=\"color-dot\"></text><text class=\"lucky-value\">珊瑚粉</text><text class=\"lucky-label\">幸运色</text></view><view><text class=\"lucky-symbol\">7</text><text class=\"lucky-value\">一点小幸运</text><text class=\"lucky-label\">幸运数字</text></view><view><text class=\"lucky-symbol\">↗</text><text class=\"lucky-value\">去吹吹风</text><text class=\"lucky-label\">今日灵感</text></view></view></view>\r\n  <button class=\"record-entry surface row\" bindtap=\"records\"><view><text class=\"card-label\">湾月的生活记录</text><text class=\"record-copy\">簪一朵花，把泉州带在身边。</text></view><text class=\"card-chevron\">›</text></button>\r\n  <button class=\"primary-button chat-button\" bindtap=\"chat\">和{{item.name}}聊聊 <text>↗</text></button>\r\n  <view class=\"footnote note\">角色创作 · 运势为固定演示内容<br/>仅供娱乐，不作为现实决策依据</view>\r\n</view></view>\r\n","config":{"navigationStyle":"default","enableShareAppMessage":true,"navigationBarTitleText":"湾月的今日运势"}},"character":{"source":"const { items } = require('../../utils/data');\nconst wardrobeView = require('../../utils/wardrobe-view');\nPage(Object.assign({}, wardrobeView.methods, {\n  data: Object.assign({ item: items.star }, wardrobeView.initialData()),\n  onLoad(options = {}) {\n    const item = items[options.id] || items.star;\n    this.setData({ item, showBindPanel: options.bind === '1' });\n    if (wx.setNavigationBarTitle) wx.setNavigationBarTitle({ title: item.name + '的衣橱' });\n    this.refresh();\n  },\n  onShow() { this.refresh(); }\n}));\n","template":"<view class=\"page character-page\"><view class=\"content character\">\r\n  <view class=\"character-heading\"><view><text class=\"eyebrow\">MY WARDROBE</text><view class=\"title name\">{{item.name}}的衣橱</view></view><view class=\"character-description\"><text>换个穿法，还是{{item.name}}。</text><text>点选衣装，即刻换上</text></view></view>\r\n  <view class=\"hero\"><image wx:if=\"{{item.id === 'star' ? quanzhouScene : false}}\" class=\"gucuo-lines\" src=\"/assets/quanzhou-gucuo-lines.png\" mode=\"aspectFit\" aria-hidden=\"true\" /><view wx:if=\"{{item.id === 'star'}}\" class=\"hero-shadow\"></view><dress-avatar wx:if=\"{{hasDress}}\" class=\"hero-image\" layers=\"{{layers}}\" /><image wx:else=\"true\" src=\"{{item.image}}\" mode=\"aspectFit\" class=\"hero-image\" /><text class=\"hero-caption\">{{hasDress ? '我的搭配 · 已自动保存' : '海丝簪花漫游 · 首发造型'}}</text></view>\r\n  <view class=\"inline-wardrobe\">\n  <view class=\"look-text\">{{selectionText}}</view>\n  <view class=\"wardrobe-bar\"><view><text class=\"section-title\">给{{item.name}}换装</text><text class=\"owned-count\">已绑定 {{ownedCount}} 件</text></view><button class=\"bind-toggle\" bindtap=\"toggleBind\">{{showBindPanel ? '收起绑定' : '绑定新衣装 ＋'}}</button></view>\n  <view class=\"slot-tabs\"><button wx:for=\"{{slots}}\" wx:key=\"id\" class=\"slot {{activeSlot === item.id ? 'active' : ''}}\" data-slot=\"{{item.id}}\" bindtap=\"selectSlot\">{{item.name}}</button></view>\n  <view class=\"pieces\"><button class=\"piece {{item.selected ? 'selected' : ''}} {{item.owned ? '' : 'locked'}}\" wx:for=\"{{rows}}\" wx:key=\"id\" data-id=\"{{item.id}}\" bindtap=\"choose\"><view class=\"piece-image\"><image src=\"{{item.thumb}}\" mode=\"aspectFit\" /><text class=\"piece-status\">{{item.status}}</text></view><view class=\"piece-name\">{{item.name}}</view><view class=\"piece-state\">{{item.selected ? '正在穿戴 ✓' : item.owned ? '点选穿上' : '绑定后解锁'}}</view></button></view>\n  <button class=\"remove-button\" bindtap=\"remove\">取下当前{{activeSlot === 'top' ? '上衣' : activeSlot === 'bottom' ? '下装' : activeSlot === 'shoes' ? '鞋履' : '头饰'}}</button>\n  <view class=\"outfits\"><button wx:for=\"{{outfitRows}}\" wx:key=\"id\" data-id=\"{{item.id}}\" bindtap=\"outfit\"><text>{{item.name}}</text><text class=\"outfit-state\">{{item.status}} · {{item.ready ? '一键穿戴' : '待绑定'}}</text></button></view>\n  <view wx:if=\"{{showBindPanel}}\" class=\"bind-panel\"><view class=\"section-title\">新衣装，扫码收进来</view><view class=\"subtitle\">绑定后可反复搭配，不会改变本体领养状态。</view><button class=\"primary-button scan-button\" bindtap=\"scan\" disabled=\"{{!enabled}}\">扫描衣装二维码</button><view class=\"code-input-row\"><input value=\"{{code}}\" bindinput=\"input\" maxlength=\"512\" placeholder=\"或输入衣装绑定码\" /><button bindtap=\"bind\" disabled=\"{{!enabled}}\">绑定</button></view></view>\n  <view wx:if=\"{{enabled}}\"><button class=\"demo-tools-toggle\" bindtap=\"toggleDemoTools\">{{showDemoTools ? '收起演示工具' : '展开演示工具'}} ›</button><view wx:if=\"{{showDemoTools}}\" class=\"demo-panel\"><view class=\"demo-label\">本机演示工具 · 不是真实商品权益</view><view class=\"account-row\"><button class=\"{{account === 'demo-a' ? 'active' : ''}}\" data-account=\"demo-a\" bindtap=\"account\">演示账号 A</button><button class=\"{{account === 'demo-b' ? 'active' : ''}}\" data-account=\"demo-b\" bindtap=\"account\">演示账号 B</button></view><view class=\"footnote\">可测试重复扫码、跨账号抢绑、单件绑定与混搭。公开演示码不用于生产包装。</view><button class=\"code-toggle\" bindtap=\"toggleCodes\">{{showCodes ? '收起演示二维码' : '查看套装 / 单件演示二维码'}} ›</button><view wx:if=\"{{showCodes}}\" class=\"demo-codes\"><view wx:for=\"{{codes}}\" wx:key=\"code\" class=\"demo-code\"><image src=\"{{item.qr}}\" mode=\"aspectFit\" data-url=\"{{item.qr}}\" bindtap=\"previewCode\" /><view><view class=\"piece-name\">{{item.name}}</view><view class=\"footnote code-label\">{{item.code}}</view><button class=\"fill-code\" data-code=\"{{item.code}}\" bindtap=\"useCode\">填入此码</button></view></view></view><button class=\"reset-button\" bindtap=\"reset\">重置本机衣橱演示</button></view></view>\n  <view wx:else=\"true\" class=\"footnote wardrobe-unavailable\">衣装服务尚未接入。真实版本将由服务器核销独立绑定码并保存账号衣橱。</view>\n</view>\n\r\n</view></view>\r\n","config":{"navigationStyle":"default","navigationBarTitleText":"湾月的衣橱"}},"shop":{"source":"Page(require('../../utils/shop-page').createShopPage());\n","template":"<view class=\"shop-page\">\n  <view class=\"shop-content\">\n    <view class=\"store-toolbar\"><image class=\"store-logo\" src=\"/assets/bubupie-wordmark.png\" mode=\"aspectFit\" /><button class=\"bag-link\" bindtap=\"bag\" aria-label=\"打开购物袋\">购物袋 <text wx:if=\"{{bagCount}}\">{{bagCount}}</text><text class=\"small-arrow\">↗</text></button></view>\n    <view class=\"store-heading\">好物，刚刚好。</view><view class=\"store-subtitle\">给喜欢留个位置。</view>\n    <view class=\"search-box\"><text class=\"search-symbol\">⌕</text><input placeholder=\"搜索好物，或输入推广关键词领券\" value=\"{{query}}\" bindinput=\"input\" bindconfirm=\"search\" confirm-type=\"search\" maxlength=\"60\" /><button wx:if=\"{{query}}\" class=\"clear-search\" bindtap=\"clearSearch\" aria-label=\"清空搜索\">×</button><button class=\"search-submit\" bindtap=\"search\">搜索</button></view>\n    <button class=\"coupon-entry\" bindtap=\"coupons\"><view><text class=\"coupon-entry-title\">我的优惠券</text><text class=\"coupon-entry-note\">{{availableCount ? availableCount + '张可用 · 选好物时自动抵扣' : '搜索推广关键词，领取今日好礼'}}</text></view><text class=\"blue-arrow\">›</text></button>\n    <view wx:if=\"{{notice}}\" class=\"search-notice\"><view class=\"notice-title\">{{promotion ? (promotion.fresh ? '专属好礼已到账' : '今日好礼已领取') : notice}}</view><view wx:if=\"{{promotion}}\" class=\"notice-description\">{{notice}}，可在“我的优惠券”查看。</view><button wx:if=\"{{promotion}}\" bindtap=\"coupons\">查看优惠券 ›</button></view>\n    <view class=\"category-heading\"><text>逛逛分类</text><button class=\"all-categories {{category === 'all' ? 'active' : ''}}\" data-id=\"all\" bindtap=\"selectCategory\">全部好物 ›</button></view>\n    <view class=\"category-grid\"><button wx:for=\"{{categories}}\" wx:key=\"id\" class=\"category-card {{category === item.id ? 'selected' : ''}}\" data-id=\"{{item.id}}\" bindtap=\"selectCategory\"><image src=\"{{item.image}}\" mode=\"aspectFit\" /><view><text class=\"category-name\">{{item.name}}</text><text class=\"category-subtitle\">{{item.subtitle}}</text></view></button></view>\n    <view class=\"section-heading\"><view>{{sectionTitle}}</view><text>{{count}}件好物</text></view>\n    <view wx:if=\"{{enabled}}\" class=\"product-grid\"><button wx:for=\"{{products}}\" wx:key=\"id\" class=\"product-card\" data-id=\"{{item.id}}\" bindtap=\"product\" aria-label=\"查看{{item.name}}详情\"><view class=\"product-image-wrap\"><image src=\"{{item.image}}\" mode=\"aspectFit\" /></view><view class=\"product-card-copy\"><text class=\"product-badge\">{{item.badge}}</text><text class=\"product-title\">{{item.name}}</text><text class=\"product-subtitle\">{{item.subtitle}}</text><text class=\"product-more\">进一步了解 <text>›</text></text></view></button></view>\n    <view wx:if=\"{{!count}}\" class=\"search-empty\"><view>还没找到这件好物。</view><text>试试“海风”“手账”或其他商品名称。</text><button data-id=\"all\" bindtap=\"selectCategory\">看看全部好物 ›</button></view>\n    <view class=\"store-footer\"><text>概念商城 · 商品与价格用于本地体验</text><button bindtap=\"distributor\">合作伙伴工作台 ›</button><button wx:if=\"{{enabled}}\" bindtap=\"toggleTools\">演示设置</button><view wx:if=\"{{showTools}}\"><text>当前买家：{{buyer}}</text><button bindtap=\"switchBuyer\">切换演示买家 A / B</button><text>试搜：海风小店 / 巷口伙伴 / 湾月好礼</text></view></view>\n  </view>\n</view>\n","config":{"navigationStyle":"default","navigationBarTitleText":"商城","navigationBarBackgroundColor":"#F5F5F7"}},"distributor":{"source":"const commerce = require('../../utils/commerce');\nPage({\n  data: { enabled: false, agentId: 'A', channel: {}, report: {}, qr: '', showTools: false, orders: [] },\n  onLoad() { this.refresh(); },\n  onShow() { this.refresh(); },\n  refresh() {\n    const report = commerce.dashboard(this.data.agentId), channel = commerce.channels.find(c => c.agentId === this.data.agentId);\n    if (!report) { this.setData({ enabled: false }); return; }\n    const display = {}; Object.keys(report).filter(k => k !== 'orders').forEach(k => display[k] = k === 'count' ? report[k] : commerce.money(report[k]));\n    this.setData({ enabled: true, report: display, channel, orders: report.orders.map(o => ({ id: o.id, original: commerce.money(o.original), discount: commerce.money(o.discount), commission: commerce.money(o.status === 'refunded' ? 0 : o.commission), status: ({ paid: '待收货', received: '售后期内', eligible: '可结算', settled: '已结算', refunded: '已冲回' })[o.status] })) });\n  },\n  copyKeyword() { wx.setClipboardData({ data: this.data.channel.keyword }); },\n\n\n  openPage() { wx.navigateTo({ url: '/pages/shop-entry/index?keyword=' + encodeURIComponent(this.data.channel.keyword) }); },\n  toggleTools() { this.setData({ showTools: !this.data.showTools }); },\n  switchAgent() { this.setData({ agentId: this.data.agentId === 'A' ? 'B' : 'A', qr: '' }); this.refresh(); },\n  settle() { wx.showModal({ title: '模拟结算可结算佣金', content: '仅将已确认收货且售后期结束的演示订单记为已结算，不转账。', success: res => { if (res.confirm) { commerce.settle(this.data.agentId); this.refresh(); } } }); },\n  onShareAppMessage() { return { title: this.data.channel.name + ' · 搜索关键词领取今日好礼', path: '/pages/shop-entry/index?keyword=' + encodeURIComponent(this.data.channel.keyword) }; }\n});\n","template":"<view class=\"page\"><view class=\"content distributor\"><view class=\"eyebrow\">BUBU PIE · PARTNER</view><view class=\"title\">我的推广与收益</view><view class=\"subtitle\">本机演示工作台 · 未接真实账号与转账</view>\n  <view wx:if=\"{{enabled}}\"><view class=\"channel surface\"><view class=\"section-title\">{{channel.name}}</view><view class=\"footnote\">分享专属关键词，消费者搜索后领券再购买。</view><view class=\"keyword-label\">我的推广关键词</view><view class=\"agent-keyword\">{{channel.keyword}}</view><view class=\"footnote\">搜索后可领取¥{{channel.value / 100}}无门槛当日券。</view><button class=\"primary-button\" bindtap=\"copyKeyword\">复制推广关键词</button><button class=\"text-action\" bindtap=\"openPage\">预览商城搜索入口 ↗</button></view><view class=\"stats\"><view class=\"stat surface\"><text>原价销售额</text><view>¥{{report.original}}</view></view><view class=\"stat surface\"><text>有效销售额</text><view>¥{{report.net}}</view></view><view class=\"stat surface\"><text>累计有效佣金</text><view>¥{{report.commission}}</view></view><view class=\"stat surface\"><text>可结算</text><view>¥{{report.eligible}}</view></view></view>\n  <view class=\"ledger surface\"><view class=\"row\"><text>订单数</text><text>{{report.count}}</text></view><view class=\"row\"><text>退款商品原价</text><text>¥{{report.refund}}</text></view><view class=\"row\"><text>平台用券额（独立统计）</text><text>¥{{report.couponExpense}}</text></view><view class=\"row\"><text>待结算佣金</text><text>¥{{report.pending}}</text></view><view class=\"row\"><text>累计已结算</text><text>¥{{report.settled}}</text></view><view class=\"row\"><text>结算后退款待抵扣</text><text>¥{{report.reversed}}</text></view><button class=\"primary-button\" bindtap=\"settle\">模拟结算</button></view>\n  <view class=\"rule\">佣金 = 商品原价合计 × 20%。优惠券由平台承担，不减少佣金；退款冲回对应佣金。确认收货且售后期结束后，才进入可结算。</view>\n  <view class=\"section-title\">推广订单</view><view wx:if=\"{{!orders.length}}\" class=\"empty\">先进入专属商城，模拟购买一件商品。</view><view class=\"order surface\" wx:for=\"{{orders}}\" wx:key=\"id\"><view class=\"row\"><text>{{item.id}}</text><text>{{item.status}}</text></view><view class=\"footnote\">原价 ¥{{item.original}} · 平台券 ¥{{item.discount}}</view><view>佣金 ¥{{item.commission}}</view></view>\n  <button class=\"text-action\" bindtap=\"toggleTools\">{{showTools ? '收起' : '展开'}}代理演示工具</button><button wx:if=\"{{showTools}}\" class=\"text-action\" bindtap=\"switchAgent\">切换演示代理 A / B</button></view>\n  <view wx:else=\"true\" class=\"empty\">代理服务尚未接入，需正式身份认证。</view>\n</view></view>\n","config":{"navigationBarTitleText":"代理工作台 · 演示"}},"chat":{"source":"const { items } = require('../../utils/data');\nconst { getDaily } = require('../../utils/daily');\nconst config = require('../../utils/config');\nconst { prompts, reply } = require('../../utils/chat-prompts');\nPage({\n  data: { characterImage: '/assets/avatars/wan-yue-portrait-v36.png', userAvatar: '/assets/avatars/user-default.png', userName: '我', item: items.star, input: '', prompts, daily: {}, scrollTarget: '', messages: [] },\n  onLoad(options = {}) {\n    const item = items[options.id] || items.star;\n    this.override = config.mode === 'mock' && config.enableDemoTools && options.demo === '1' ? options.mood : '';\n    const profile = wx.getStorageSync('mio_profile') || {};\n    this.setData({ item, characterImage: '/assets/avatars/wan-yue-portrait-v36.png', userName: profile.nickname || '我', daily: getDaily(item.id, this.override), messages: [{ id: 1, role: 'friend', text: '海风把你带来啦，我是' + item.name + '。今天想和我聊点什么？先选一个小问题也可以。' }] });\n  },\n  onShow() { if (this.data.item) this.setData({ daily: getDaily(this.data.item.id, this.override) }); },\n  input(e) { this.setData({ input: e.detail.value }); },\n  choose(e) { const p = prompts.find(x => x.id === e.currentTarget.dataset.id); if (p) this.respond(p.text, p.id); },\n  respond(value, promptId) {\n    const daily = getDaily(this.data.item.id, this.override), now = this.data.messages.length + 1;\n    this.setData({ daily, input: '', messages: this.data.messages.concat([{ id: now, role: 'user', text: value }, { id: now + 1, role: 'friend', text: reply(promptId, daily) }]), scrollTarget: 'message-' + (now + 1) });\n  },\n  send() {\n    const value = this.data.input.trim();\n    if (!value) return;\n    const id = /幸运色|穿什么|怎么穿/.test(value) ? 'color' : /预感/.test(value) ? 'feeling' : /运势|宜|忌/.test(value) ? 'fortune' : '';\n    this.respond(value, id);\n  }\n});\n","template":"<view class=\"chat-page\">\n  <view class=\"chat-status\"><view class=\"status-dot\"></view><text>湾月今天{{daily.label}}</text><text class=\"status-date\">{{daily.date}}</text></view>\n  <scroll-view scroll-y=\"{{true}}\" class=\"messages\" scroll-into-view=\"{{scrollTarget}}\" scroll-with-animation=\"{{true}}\"><view class=\"messages-content\">\n    <block wx:for=\"{{messages}}\" wx:key=\"id\">\n      <view id=\"message-{{item.id}}\" class=\"message-row {{item.role}}\"><image wx:if=\"{{item.role === 'friend'}}\" class=\"chat-avatar friend-avatar\" src=\"{{characterImage}}\" mode=\"aspectFill\" /><view class=\"message-column\"><text class=\"message-author\">{{item.role === 'friend' ? '湾月' : userName}}</text><view class=\"bubble\">{{item.text}}</view></view><image wx:if=\"{{item.role === 'user'}}\" class=\"chat-avatar user-avatar\" src=\"{{userAvatar}}\" mode=\"aspectFill\" /></view>\n      <view wx:if=\"{{index === 0}}\" class=\"quick-prompts\"><view class=\"prompt-title\">从一个小问题开始</view><button wx:for=\"{{prompts}}\" wx:for-item=\"prompt\" wx:key=\"id\" class=\"prompt\" data-id=\"{{prompt.id}}\" bindtap=\"choose\"><text>{{prompt.text}}</text><text class=\"prompt-arrow\">↗</text></button></view>\n    </block>\n    <view class=\"chat-end\" id=\"chat-end\"></view>\n  </view></scroll-view>\n  <view class=\"composer-area\"><view class=\"composer\"><input placeholder=\"和湾月说点什么…\" maxlength=\"500\" value=\"{{input}}\" bindinput=\"input\" confirm-type=\"send\" bindconfirm=\"send\" adjust-position=\"{{true}}\" cursor-spacing=\"20\" /><button bindtap=\"send\" disabled=\"{{!input}}\" aria-label=\"发送\">↑</button></view><view class=\"chat-demo-note\">湾月的生活小灵感 · 本地情境演示</view></view>\n</view>\r\n","config":{"navigationBarTitleText":"和湾月聊聊","navigationBarBackgroundColor":"#F5F5F7","disableScroll":true}},"product":{"source":"const commerce = require('../../utils/commerce');\nPage({\n  data: { item: null, amount: '', quantity: 1, added: false },\n  onLoad(options = {}) {\n    const item = commerce.products.find(p => p.id === options.id);\n    this.setData({ item: item || null, amount: item ? commerce.money(item.price) : '' });\n    if (item && wx.setNavigationBarTitle) wx.setNavigationBarTitle({ title: item.name });\n  },\n  quantity(e) { this.setData({ quantity: Math.max(1, Math.min(99, this.data.quantity + Number(e.currentTarget.dataset.delta))), added: false }); },\n  add() {\n    if (!this.data.item) return;\n    const id = this.data.item.id, current = commerce.cart()[id] || 0;\n    if (current + this.data.quantity > 99) { wx.showToast({ title: '每件好物最多选择99件', icon: 'none' }); return; }\n    if (!commerce.setQuantity(id, current + this.data.quantity)) { wx.showToast({ title: '商品服务暂不可用', icon: 'none' }); return; }\n    this.setData({ added: true }); wx.showToast({ title: '已加入购物袋', icon: 'success' });\n  },\n  bag() { wx.switchTab({ url: '/pages/bag/index' }); },\n  onShareAppMessage() { return { title: this.data.item ? this.data.item.name : '布布小伴好物', path: '/pages/product/index?id=' + (this.data.item ? this.data.item.id : 'body') }; }\n});\n","template":"<view class=\"product-page\"><view wx:if=\"{{item}}\"><view class=\"detail-intro\"><text class=\"detail-badge\">{{item.badge}}</text><view class=\"detail-title\">{{item.name}}</view><view class=\"detail-subtitle\">{{item.subtitle}}</view></view><view class=\"detail-hero\"><image src=\"{{item.image}}\" mode=\"aspectFit\" /></view><view class=\"detail-content\"><view class=\"price-label\">演示价格</view><view class=\"detail-price\">¥{{amount}}</view><view class=\"detail-description\">{{item.description}}</view><view class=\"highlights\"><view wx:for=\"{{item.highlights}}\" wx:key=\"*this\"><text>＋</text>{{item}}</view></view><view class=\"quantity-row\"><text>数量</text><view class=\"quantity-picker\"><button data-delta=\"-1\" bindtap=\"quantity\" aria-label=\"减少商品数量\">−</button><text>{{quantity}}</text><button data-delta=\"1\" bindtap=\"quantity\" aria-label=\"增加商品数量\">＋</button></view></view><view class=\"detail-note\">{{item.note}}。后续款与生活好物为设计概念，实物上市信息待确认。</view></view><view class=\"detail-bottom\"><button class=\"view-bag\" bindtap=\"bag\">查看购物袋</button><button class=\"add-to-bag\" bindtap=\"add\">{{added ? '已加入 · 再加一件' : '加入购物袋'}}</button></view></view><view wx:else=\"true\" class=\"empty\">这件好物暂时找不到了。</view></view>\n","config":{"navigationBarTitleText":"好物详情","navigationBarBackgroundColor":"#FFFFFF"}},"bag":{"source":"const commerce = require('../../utils/commerce');\nconst labels = { paid: '待收货', received: '售后期内', eligible: '可结算', settled: '佣金已结算', refunded: '已退款' };\nPage({\n  data: { items: [], totals: {}, coupon: null, useCoupon: true, orders: [], showOrders: false, notice: '' },\n  onLoad() { this.refresh(); }, onShow() { this.refresh(); },\n  refresh() {\n    const cart = commerce.cart(), q = commerce.quote(cart, this.data.useCoupon), s = commerce.snapshot();\n    this.setData({ items: q.lines.map(line => Object.assign({}, line, { image: commerce.products.find(p => p.id === line.productId).image, amount: commerce.money(line.unitPrice) })),\n      totals: { original: commerce.money(q.original), discount: commerce.money(q.discount), payable: commerce.money(q.payable), count: q.lines.reduce((n, x) => n + x.quantity, 0) },\n      coupon: s.coupon ? { amount: commerce.money(s.coupon.value) } : null,\n      orders: s.orders.map(o => Object.assign({}, o, { statusText: labels[o.status], amount: commerce.money(o.original), paidText: commerce.money(o.payable), discountText: commerce.money(o.discount) })) });\n  },\n  quantity(e) { const id = e.currentTarget.dataset.id, current = commerce.cart()[id] || 0; commerce.setQuantity(id, Math.max(0, Math.min(99, current + Number(e.currentTarget.dataset.delta)))); this.refresh(); },\n  remove(e) { commerce.setQuantity(e.currentTarget.dataset.id, 0); this.refresh(); },\n  toggleCoupon() { this.setData({ useCoupon: !this.data.useCoupon }); this.refresh(); },\n  coupons() { wx.navigateTo({ url: '/pages/coupons/index' }); },\n  shop() { wx.switchTab({ url: '/pages/shop/index' }); },\n  toggleOrders() { this.setData({ showOrders: !this.data.showOrders }); },\n  checkout() {\n    if (this.checking || !this.data.totals.count || !commerce.enabled()) return;\n    this.checking = true;\n    const cart = commerce.cart(), useCoupon = this.data.useCoupon, before = commerce.snapshot(), quoted = commerce.quote(cart, useCoupon), key = 'checkout-' + Date.now();\n    wx.showModal({ title: '确认模拟订单', content: '商品 ¥' + commerce.money(quoted.original) + '，优惠 −¥' + commerce.money(quoted.discount) + '，合计 ¥' + commerce.money(quoted.payable) + '。本地演示，不会扣款或发货。', confirmText: '模拟付款', success: res => {\n      if (!res.confirm) return;\n      const after = commerce.snapshot(), current = commerce.quote(commerce.cart(), useCoupon);\n      if (after.buyer !== before.buyer || JSON.stringify(commerce.cart()) !== JSON.stringify(cart) || (after.channel && after.channel.token) !== (before.channel && before.channel.token) || current.payable !== quoted.payable || current.couponId !== quoted.couponId) { wx.showToast({ title: '订单信息变化，请重新确认', icon: 'none' }); return; }\n      const result = commerce.order(cart, key, useCoupon);\n      if (result.ok) { commerce.clearCart(); this.setData({ notice: '模拟订单已完成', showOrders: true }); }\n      else wx.showToast({ title: result.message, icon: 'none' });\n    }, complete: () => { this.checking = false; this.refresh(); } });\n  },\n  progress(e) { commerce.transition(e.currentTarget.dataset.id, e.currentTarget.dataset.action); this.refresh(); },\n  refund(e) { const id = e.currentTarget.dataset.id; wx.showModal({ title: '模拟整单退款', content: '退实际付款并冲回销售额和佣金。当日有效券返还，过期不延期。', success: res => { if (res.confirm) { commerce.refund(id); this.refresh(); } } }); }\n});\n","template":"<view class=\"bag-page\"><view class=\"bag-title\">你的购物袋。</view><view class=\"bag-subtitle\">{{totals.count ? '喜欢的好物，都在这里。' : '给下一件喜欢，留个位置。'}}</view><view wx:if=\"{{notice}}\" class=\"bag-notice\">{{notice}}</view>\n  <view wx:for=\"{{items}}\" wx:key=\"productId\" class=\"bag-item\"><image src=\"{{item.image}}\" mode=\"aspectFit\" /><view class=\"bag-item-copy\"><view class=\"bag-item-name\">{{item.name}}</view><view class=\"bag-item-price\">¥{{item.amount}}</view><view class=\"bag-item-actions\"><view class=\"bag-stepper\"><button data-id=\"{{item.productId}}\" data-delta=\"-1\" bindtap=\"quantity\" aria-label=\"减少商品数量\">−</button><text>{{item.quantity}}</text><button data-id=\"{{item.productId}}\" data-delta=\"1\" bindtap=\"quantity\" aria-label=\"增加商品数量\">＋</button></view><button class=\"remove\" data-id=\"{{item.productId}}\" bindtap=\"remove\">移除</button></view></view></view>\n  <view wx:if=\"{{totals.count}}\" class=\"bag-summary\"><view class=\"summary-row\"><text>商品小计</text><text>¥{{totals.original}}</text></view><view class=\"summary-row\"><button class=\"coupon-choice\" bindtap=\"toggleCoupon\">{{useCoupon ? '☑' : '□'}} {{coupon ? '使用¥' + coupon.amount + '优惠券' : '暂无可用优惠券'}}</button><text>−¥{{totals.discount}}</text></view><button class=\"coupon-link\" bindtap=\"coupons\">查看我的优惠券 ›</button><view class=\"summary-total\"><text>合计</text><text>¥{{totals.payable}}</text></view><button class=\"checkout-button\" bindtap=\"checkout\">确认模拟订单</button><text class=\"bag-note\">演示价格与流程 · 不产生真实交易</text></view>\n  <view wx:else=\"true\" class=\"bag-empty\"><view class=\"empty-bag-icon\">♡</view><button class=\"shop-button\" bindtap=\"shop\">继续逛好物</button></view>\n  <button class=\"orders-toggle\" bindtap=\"toggleOrders\">我的演示订单 · {{orders.length}} <text>{{showOrders ? '−' : '＋'}}</text></button><view wx:if=\"{{showOrders}}\"><view wx:if=\"{{!orders.length}}\" class=\"bag-note\">还没有演示订单。</view><view wx:for=\"{{orders}}\" wx:key=\"id\" class=\"order\"><view class=\"summary-row\"><text>{{item.id}}</text><text>{{item.statusText}}</text></view><view class=\"order-note\">商品 ¥{{item.amount}} · 优惠 ¥{{item.discountText}} · 实付 ¥{{item.paidText}}</view><view class=\"order-actions\"><button wx:if=\"{{item.status === 'paid'}}\" data-id=\"{{item.id}}\" data-action=\"receive\" bindtap=\"progress\">模拟确认收货</button><button wx:if=\"{{item.status === 'received'}}\" data-id=\"{{item.id}}\" data-action=\"afterSale\" bindtap=\"progress\">模拟售后期结束</button><button wx:if=\"{{item.status !== 'refunded'}}\" data-id=\"{{item.id}}\" bindtap=\"refund\">模拟退款</button></view></view></view>\n</view>\n","config":{"navigationBarTitleText":"购物袋","navigationBarBackgroundColor":"#FFFFFF"}},"coupons":{"source":"const commerce = require('../../utils/commerce');\nPage({\n  data: { tab: 'available', tabs: [{ id: 'available', name: '可使用' }, { id: 'used', name: '已使用' }, { id: 'expired', name: '已过期' }], coupons: [], counts: {}, emptyTitle: '', emptyNote: '' },\n  onLoad() { this.refresh(); }, onShow() { this.refresh(); },\n  refresh() {\n    const list = commerce.coupons(), counts = {};\n    this.data.tabs.forEach(t => counts[t.id] = list.filter(c => c.status === t.id).length);\n    const copy = { available: ['还没有可用的优惠券。', '在商城搜索推广关键词，今日好礼就会到账。'], used: ['还没有使用记录。', '用券完成购买后，可以在这里查看。'], expired: ['还没有过期的优惠券。', '当天领取的好礼，记得当天使用。'] }[this.data.tab];\n    this.setData({ counts, coupons: list.filter(c => c.status === this.data.tab).map(c => Object.assign({}, c, { dateText: c.claimDate.replace(/-/g, '.'), stateText: ({ available: '今日可用', used: '已使用', expired: '已过期' })[c.status] })), emptyTitle: copy[0], emptyNote: copy[1] });\n  },\n  selectTab(e) { this.setData({ tab: e.currentTarget.dataset.id }); this.refresh(); },\n  shop() { wx.switchTab({ url: '/pages/shop/index' }); }\n});\n","template":"<view class=\"coupons-page\"><view class=\"wallet-title\"><view>每一份好礼，</view><view>都在这里。</view></view><view class=\"wallet-subtitle\">全商城商品通用 · 无门槛 · 当日有效</view><view class=\"coupon-tabs\"><button wx:for=\"{{tabs}}\" wx:key=\"id\" data-id=\"{{item.id}}\" class=\"{{tab === item.id ? 'selected' : ''}}\" bindtap=\"selectTab\">{{item.name}}<text>{{counts[item.id] || 0}}</text></button></view><view class=\"wallet-list\"><view class=\"wallet-coupon {{item.status !== 'available' ? 'inactive' : ''}}\" wx:for=\"{{coupons}}\" wx:key=\"id\"><view class=\"coupon-value\"><text>¥</text>{{item.amount}}</view><view class=\"coupon-information\"><view class=\"coupon-title\">无门槛好物券</view><view class=\"coupon-source\">{{item.source}}</view><view class=\"coupon-expiry\">{{item.dateText}} 23:59:59前有效</view></view><view class=\"coupon-state\">{{item.stateText}}</view><button wx:if=\"{{item.status === 'available'}}\" class=\"use-coupon\" bindtap=\"shop\">去使用 ›</button></view></view><view wx:if=\"{{!coupons.length}}\" class=\"coupon-empty\"><view class=\"gift-symbol\">✧</view><view>{{emptyTitle}}</view><text>{{emptyNote}}</text><button bindtap=\"shop\">去逛商城 ›</button></view><view class=\"wallet-note\">每天限领1张。搜索其他代理关键词不会重复领券，也不会延长有效期。优惠券抵扣独立计算。</view></view>\n","config":{"navigationBarTitleText":"我的优惠券","navigationBarBackgroundColor":"#F5F5F7"}},"profile":{"source":"const config = require('../../utils/config');\nPage({\n  data: { nickname: '', birthday: '', birthdayMonth: false, demoTools: config.mode === 'mock' && config.enableDemoTools },\n  testTap() { wx.navigateTo({ url: '/pages/card/index?id=star&demo=1&tag=DEMO-TAG-0001' }); },\n  onShow() { const p = wx.getStorageSync('mio_profile') || {}; this.setData({ nickname: p.nickname || '', birthday: p.birthday || '', birthdayMonth: !!p.birthday && Number(p.birthday.slice(5, 7)) === new Date().getMonth() + 1 }); },\n  coupons() { wx.navigateTo({ url: '/pages/coupons/index' }); },\n  edit() { wx.navigateTo({ url: '/pages/edit-profile/index' }); },\n  birthdayGift() { wx.showModal({ title: '生日月礼遇', content: '示例权益待配置，尚未发放真实优惠券。正式版由服务端按活动、账号和月份幂等发券。', showCancel: false }); },\n  binding() { wx.navigateTo({ url: '/pages/bind/index' }); },\n  privacy() { wx.showModal({ title: '隐私与数据', content: '此演示没有服务器。收藏、昵称及选填资料只保存在当前设备的小程序本地缓存中，可通过开发者工具或微信清理缓存删除。', showCancel: false }); },\n  help() { wx.showModal({ title: '帮助与反馈', content: '这是前端演示，尚未接入真实购买、账号绑定或客服。', showCancel: false }); }\n});\n","template":"<view class=\"page mine-page\"><view class=\"content profile\"><button class=\"profile-head\" bindtap=\"edit\"><image class=\"profile-avatar\" src=\"/assets/avatars/user-default.png\" mode=\"aspectFill\" /><view class=\"profile-copy\"><view class=\"section-title\">{{nickname || '我的'}}</view><view class=\"subtitle\">给喜欢，也给自己留个位置。</view></view><text class=\"profile-chevron\">›</text></button><view class=\"profile-group\"><button class=\"profile-row\" bindtap=\"coupons\"><view><text>我的优惠券</text><text class=\"profile-note\">查看可用好礼</text></view><text class=\"profile-chevron\">›</text></button><button class=\"profile-row\" bindtap=\"binding\"><view><text>绑定我的伙伴</text><text class=\"profile-note\">已有实物，从这里开始陪伴</text></view><text class=\"profile-chevron\">›</text></button></view><view class=\"profile-group\"><button class=\"profile-row\" bindtap=\"edit\"><text>个人资料</text><text class=\"profile-value\">{{nickname || '昵称与生日'}} ›</text></button><button class=\"profile-row\" bindtap=\"birthdayGift\"><text>生日月礼遇</text><text class=\"profile-value\">{{birthdayMonth ? '本月生日' : '查看说明'}} ›</text></button></view><view class=\"profile-group\"><button class=\"profile-row\" bindtap=\"privacy\"><text>隐私与数据</text><text class=\"profile-chevron\">›</text></button><button class=\"profile-row\" bindtap=\"help\"><text>帮助与反馈</text><text class=\"profile-chevron\">›</text></button></view><view wx:if=\"{{demoTools}}\" class=\"profile-group\"><button class=\"profile-row\" bindtap=\"testTap\"><view><text>碰一碰测试</text><text class=\"profile-note\">开发演示 · 一句话与固定编号预览</text></view><text class=\"profile-chevron\">›</text></button></view><view class=\"profile-footnote\">布布小伴 BUBU PIE</view></view></view>\r\n","config":{"navigationStyle":"default","navigationBarTitleText":"我的","navigationBarBackgroundColor":"#F5F5F7"}},"shop-entry":{"source":"Page(require('../../utils/shop-page').createShopPage());\n","template":"<view class=\"shop-page\">\n  <view class=\"shop-content\">\n    <view class=\"store-toolbar\"><image class=\"store-logo\" src=\"/assets/bubupie-wordmark.png\" mode=\"aspectFit\" /><button class=\"bag-link\" bindtap=\"bag\" aria-label=\"打开购物袋\">购物袋 <text wx:if=\"{{bagCount}}\">{{bagCount}}</text><text class=\"small-arrow\">↗</text></button></view>\n    <view class=\"store-heading\">好物，刚刚好。</view><view class=\"store-subtitle\">给喜欢留个位置。</view>\n    <view class=\"search-box\"><text class=\"search-symbol\">⌕</text><input placeholder=\"搜索好物，或输入推广关键词领券\" value=\"{{query}}\" bindinput=\"input\" bindconfirm=\"search\" confirm-type=\"search\" maxlength=\"60\" /><button wx:if=\"{{query}}\" class=\"clear-search\" bindtap=\"clearSearch\" aria-label=\"清空搜索\">×</button><button class=\"search-submit\" bindtap=\"search\">搜索</button></view>\n    <button class=\"coupon-entry\" bindtap=\"coupons\"><view><text class=\"coupon-entry-title\">我的优惠券</text><text class=\"coupon-entry-note\">{{availableCount ? availableCount + '张可用 · 选好物时自动抵扣' : '搜索推广关键词，领取今日好礼'}}</text></view><text class=\"blue-arrow\">›</text></button>\n    <view wx:if=\"{{notice}}\" class=\"search-notice\"><view class=\"notice-title\">{{promotion ? (promotion.fresh ? '专属好礼已到账' : '今日好礼已领取') : notice}}</view><view wx:if=\"{{promotion}}\" class=\"notice-description\">{{notice}}，可在“我的优惠券”查看。</view><button wx:if=\"{{promotion}}\" bindtap=\"coupons\">查看优惠券 ›</button></view>\n    <view class=\"category-heading\"><text>逛逛分类</text><button class=\"all-categories {{category === 'all' ? 'active' : ''}}\" data-id=\"all\" bindtap=\"selectCategory\">全部好物 ›</button></view>\n    <view class=\"category-grid\"><button wx:for=\"{{categories}}\" wx:key=\"id\" class=\"category-card {{category === item.id ? 'selected' : ''}}\" data-id=\"{{item.id}}\" bindtap=\"selectCategory\"><image src=\"{{item.image}}\" mode=\"aspectFit\" /><view><text class=\"category-name\">{{item.name}}</text><text class=\"category-subtitle\">{{item.subtitle}}</text></view></button></view>\n    <view class=\"section-heading\"><view>{{sectionTitle}}</view><text>{{count}}件好物</text></view>\n    <view wx:if=\"{{enabled}}\" class=\"product-grid\"><button wx:for=\"{{products}}\" wx:key=\"id\" class=\"product-card\" data-id=\"{{item.id}}\" bindtap=\"product\" aria-label=\"查看{{item.name}}详情\"><view class=\"product-image-wrap\"><image src=\"{{item.image}}\" mode=\"aspectFit\" /></view><view class=\"product-card-copy\"><text class=\"product-badge\">{{item.badge}}</text><text class=\"product-title\">{{item.name}}</text><text class=\"product-subtitle\">{{item.subtitle}}</text><text class=\"product-more\">进一步了解 <text>›</text></text></view></button></view>\n    <view wx:if=\"{{!count}}\" class=\"search-empty\"><view>还没找到这件好物。</view><text>试试“海风”“手账”或其他商品名称。</text><button data-id=\"all\" bindtap=\"selectCategory\">看看全部好物 ›</button></view>\n    <view class=\"store-footer\"><text>概念商城 · 商品与价格用于本地体验</text><button bindtap=\"distributor\">合作伙伴工作台 ›</button><button wx:if=\"{{enabled}}\" bindtap=\"toggleTools\">演示设置</button><view wx:if=\"{{showTools}}\"><text>当前买家：{{buyer}}</text><button bindtap=\"switchBuyer\">切换演示买家 A / B</button><text>试搜：海风小店 / 巷口伙伴 / 湾月好礼</text></view></view>\n  </view>\n</view>\n\n","config":{"navigationStyle":"default","navigationBarTitleText":"为湾月挑好物"}},"edit-profile":{"source":"Page({\n  data: { nickname: '', bio: '', birthday: '', today: new Date().toISOString().slice(0, 10) },\n  onLoad() { const p = wx.getStorageSync('mio_profile') || {}; this.setData({ nickname: p.nickname || '', bio: p.bio || '', birthday: p.birthday || '' }); },\n  nickname(e) { this.setData({ nickname: e.detail.value }); },\n  bio(e) { this.setData({ bio: e.detail.value }); },\n  birthday(e) { this.setData({ birthday: e.detail.value }); },\n  clearBirthday() { this.setData({ birthday: '' }); },\n  avatar() { wx.showToast({ title: '头像功能暂未接入', icon: 'none' }); },\n  save() { wx.setStorageSync('mio_profile', { nickname: this.data.nickname.trim(), bio: this.data.bio.trim(), birthday: this.data.birthday }); wx.showToast({ title: '已保存在本机', icon: 'success' }); setTimeout(() => wx.navigateBack(), 500); }\n});\n","template":"<view class=\"page\"><view class=\"content edit-profile\"><button class=\"avatar-edit\" bindtap=\"avatar\"><image src=\"/assets/edit-circle.svg\" /><text>更换头像</text></button><view class=\"field\"><text class=\"label\">昵称</text><input class=\"input-box\" maxlength=\"20\" placeholder=\"你的昵称\" value=\"{{nickname}}\" bindinput=\"nickname\" /></view><view class=\"field\"><text class=\"label\">生日（选填）</text><picker mode=\"date\" value=\"{{birthday}}\" end=\"{{today}}\" bindchange=\"birthday\"><view class=\"input-box\" style=\"line-height:104rpx;\">{{birthday || '选择生日'}}</view></picker><button wx:if=\"{{birthday}}\" bindtap=\"clearBirthday\" class=\"footnote\">清除生日</button><view class=\"footnote\">用于生日月礼遇展示，可随时删除。</view></view><view class=\"field\"><text class=\"label\">简介</text><textarea class=\"bio\" maxlength=\"80\" placeholder=\"介绍一下自己\" value=\"{{bio}}\" bindinput=\"bio\" /></view><button class=\"primary-button save\" bindtap=\"save\">保存</button><view class=\"footnote local\">资料仅保存在本机演示缓存中。</view></view></view>\r\n","config":{"navigationStyle":"default","navigationBarTitleText":"编辑资料"}},"card":{"source":"const config = require('../../utils/config');\nconst { items } = require('../../utils/data');\nconst { getDaily, isAdopted } = require('../../utils/daily');\nconst { renderShare } = require('../../utils/share');\nconst instances = require('../../utils/instances');\nPage({\n  data: { item: items.star, daily: {}, owner: false, testing: false, testRole: '', testMood: '', shareImage: '', timelineImage: '', poster: '', busy: false, posterBusy: false },\n  onLoad(options) {\n    this.instance = options.tag ? instances.findTag(options.tag) : null;\n    this.setData({ instance: this.instance, identityError: !!options.tag && !this.instance });\n    this.setData({ item: items[options.id] || items.star, testing: config.mode === 'mock' && config.enableDemoTools && options.demo === '1' });\n    if (wx.showShareMenu) wx.showShareMenu({ menus: ['shareAppMessage', 'shareTimeline'] });\n    this.refresh();\n  },\n  onShow() { if (this.data.daily.id) { const previous = this.data.daily.id; this.refresh(); if (previous !== this.data.daily.id) this.renderImages(); } },\n  onReady() { this.renderImages(); },\n  onUnload() { this.unloaded = true; this.generation = (this.generation || 0) + 1; },\n  refresh() {\n    const owner = !this.data.identityError && (this.data.testing && this.data.testRole ? this.data.testRole === 'owner' : this.instance ? instances.owned(this.instance) : isAdo tion = this.generation;\n    this.setData({ posterBusy: true });\n    try { const poster = await renderShare(this, 'poster'); if (generation === this.generation) this.setData({ poster }); }\n    catch (e) { wx.showToast({ title: '海报生成失败，请重试', icon: 'none' }); }\n    finally { if (!this.unloaded) this.setData({ posterBusy: false }); }\n  },\n  closePoster() { this.setData({ poster: '' }); },\n  imageMenu() {\n    if (wx.showShareImageMenu) wx.showShareImageMenu({ path: this.data.poster, fail: () => this.previewPoster() });\n    else this.previewPoster();\n  },\n  previewPoster() { wx.previewImage({ urls: [this.data.poster] }); },\n  timelineHelp() { wx.showModal({ title: '分享到朋友圈', content: '请点击右上角“…”再选择“分享到朋友圈”。也可以生成海报，打开图片菜单保存或分享。具体选项以微信客户端为准。', showCancel: false }); },\n  onShareAppMessage() { return { title: this.data.item.name + '给我的一句话：' + this.data.daily.quote.replace(/\\n/g, ''), path: '/pages/card/index?id=' + this.data.item.id + (this.instance ? '&tag=' + this.instance.tag : ''), imageUrl: this.data.shareImage || this.data.item.image }; },\n  onShareTimeline() { return { title: this.data.item.name + '给我的一句话', query: 'id=' + this.data.item.id + (this.instance ? '&tag=' + this.instance.tag : ''), imageUrl: this.data.timelineImage || this.data.item.image }; }\n});\n","template":"<view class=\"page card-page\" style=\"background: {{daily.color}};\">\r\n  <view wx:if=\"{{identityError}}\" class=\"content\"><view class=\"surface message-card\">暂时找不到这只伙伴，请核对入口或联系售后。</view></view><view wx:if=\"{{!identityError}}\" class=\"content\">\r\n    <view wx:if=\"{{testing}}\" class=\"test-panel surface\"><view class=\"test-title\">碰一碰测试 · 仅本页模拟身份</view><view class=\"switch-row\"><button class=\"chip {{!owner ? 'selected' : ''}}\" data-value=\"guest\" bindtap=\"setRole\">访客</button><button class=\"chip {{owner ? 'selected' : ''}}\" data-value=\"owner\" bindtap=\"setRole\">已领养</button></view><view class=\"switch-row\"><button class=\"chip {{daily.mood === 'low' ? 'selected' :
